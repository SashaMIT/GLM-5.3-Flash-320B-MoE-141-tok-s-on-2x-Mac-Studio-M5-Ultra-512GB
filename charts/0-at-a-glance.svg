es New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="middle">7.6 s</text><text x="827.0" y="351.0" font-size="13.5" font-weight="400" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="start">median first token, 8 short requests</text><line x1="35.0" y1="370" x2="1065.0" y2="370" stroke="#000000" stroke-width="0.8"/><text x="47.0" y="401.0" font-size="15.5" font-weight="400" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="start">Highest total at 64 users</text><text x="337.0" y="401.0" font-size="15.5" font-weight="400" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="start">mlx-vlm 0.8.0</text><text x="590.0" y="401.0" font-size="15.5" font-weight="400" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="middle">one per Mac</text><text x="740.0" y="401.0" font-size="15.5" font-weight="700" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="middle">334.7 tok/s</text><text x="827.0" y="401.0" font-size="13.5" font-weight="400" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="start">all users combined</text><text x="550.0" y="502.0" font-size="16" font-weight="400" font-style="normal" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="middle">Table 1. Same TensorFold model pack, same two Mac Studios (M5 Ultra, 512 GB), same day.</text><text x="550.0" y="524.0" font-size="14.5" font-weight="400" font-style="italic" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#000000" text-anchor="middle">Single user: median of 144 requests. Many users: median of 3 repeats. All MEASURED, 4-bit, lossy.</text></svg>